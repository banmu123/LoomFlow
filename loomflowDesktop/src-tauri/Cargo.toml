[package]
name = "loomflow-desktop"
version = "0.1.0"
description = "LoomFlow Desktop — Local-first AI Workflow Development Environment"
authors = ["LoomFlow"]
edition = "2021"

[lib]
name = "loomflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
