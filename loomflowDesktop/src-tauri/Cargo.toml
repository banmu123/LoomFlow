[package]
name = "loomflow-desktop"
version = "0.1.0"
description = "LoomFlow Desktop — Local-first AI Workflow Development Environment"
authors = ["LoomFlow"]
edition = "2021"

[lib]
name = "loomflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# macOS 开发态 Dock 图标。
# `tauri dev` 跑的是裸可执行文件（target/debug/loomflow-desktop），不是 .app bundle，
# 既没有 Info.plist 的 CFBundleIconFile，也没有 __icns 段，Dock 只能回退到系统通用的
# `exec` 图标。正式打包版本由 Contents/Resources/icon.icns 正常驱动，无需这段逻辑。
# 这里不引入新依赖：objc2 系列本就是 tauri 在 macOS 上的传递依赖。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
