name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Type & Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # packageManager: pnpm@9.0.0 → corepack 自动启用对应版本
      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:build

      - name: Type check
        run: pnpm ts-check

      - name: Unit tests
        run: pnpm test
        env:
          COZE_SUPABASE_URL: 'https://placeholder.supabase.co'
          COZE_SUPABASE_SERVICE_ROLE_KEY: 'placeholder'
          DEEPSEEK_API_KEY: 'placeholder'
          AUTH_SECRET: 'ci-placeholder-secret'

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          COZE_SUPABASE_URL: 'https://placeholder.supabase.co'
          COZE_SUPABASE_SERVICE_ROLE_KEY: 'placeholder'
          DEEPSEEK_API_KEY: 'placeholder'
          AUTH_SECRET: 'ci-placeholder-secret'
