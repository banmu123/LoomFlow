# =====================================================
# LoomFlow 自托管一键部署
# 用法：
#   1. cp .env.example .env
#   2. 填写 .env（必填：POSTGRES_PASSWORD / PGRST_JWT_SECRET / COZE_SUPABASE_SERVICE_ROLE_KEY）
#   3. docker compose up -d
# 首次启动自动初始化数据库（postgres 容器 initdb 脚本）
# =====================================================

services:
  # ---- PostgreSQL（数据持久化）----
  postgres:
    image: postgres:16
    container_name: loomflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: loomflow
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次启动自动执行数据库初始化（按文件名顺序）
      - ./docker/postgres/00-extensions.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
      - ./scripts/supabase-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./scripts/supabase-users.sql:/docker-entrypoint-initdb.d/20-users.sql:ro
      - ./scripts/supabase-updates.sql:/docker-entrypoint-initdb.d/30-updates.sql:ro
      - ./scripts/supabase-apikeys.sql:/docker-entrypoint-initdb.d/35-apikeys.sql:ro
      - ./scripts/supabase-versions.sql:/docker-entrypoint-initdb.d/36-versions.sql:ro
      - ./scripts/supabase-publish-version.sql:/docker-entrypoint-initdb.d/37-publish-version.sql:ro
      - ./scripts/supabase-knowledge.sql:/docker-entrypoint-initdb.d/38-knowledge.sql:ro
      - ./scripts/supabase-settings.sql:/docker-entrypoint-initdb.d/39-settings.sql:ro
      - ./docker/postgres/40-grants.sql:/docker-entrypoint-initdb.d/40-grants.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loomflow"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - loomflow-net

  # ---- PostgREST（supabase-js 的 REST 层）----
  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: loomflow-postgrest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/loomflow
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:?PGRST_JWT_SECRET is required}
      PGRST_SERVER_PORT: "3000"
    healthcheck:
      # distroless 镜像无 shell/wget/nc：用 postgrest 二进制自身做进程级检查
      test: ["CMD", "postgrest", "--version"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - loomflow-net

  # ---- Nginx 反代（/rest/v1 → PostgREST，supabase-js 兼容）----
  nginx:
    image: nginx:alpine
    container_name: loomflow-nginx
    restart: unless-stopped
    depends_on:
      postgrest:
        condition: service_healthy
    ports:
      # 宿主机访问 PostgREST（本地开发用）：仅绑定回环地址，不对外暴露
      # 本地 Next.js dev 指向 http://127.0.0.1:8123 即可连上 docker 内数据库
      - "127.0.0.1:8123:80"
    volumes:
      - ./docker/nginx/rest.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - loomflow-net

  # ---- 数据库迁移（每次 compose up 自动执行；SQL 全部幂等，可重复运行）----
  # initdb 脚本只在数据卷首次初始化时执行；已有数据库的增量变更靠这个容器补齐
  migration:
    image: postgres:16
    container_name: loomflow-migration
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./scripts/supabase-updates.sql:/migrations/updates.sql:ro
    command:
      - psql
      - -h
      - postgres
      - -U
      - postgres
      - -d
      - loomflow
      - -v
      - ON_ERROR_STOP=0
      - -f
      - /migrations/updates.sql
    networks:
      - loomflow-net

  # ---- LoomFlow 应用 ----
  loomflow:
    image: loomflow:latest   # 显式镜像名：可预构建导出/推送，服务器免构建部署
    build: .
    container_name: loomflow-app
    restart: unless-stopped
    depends_on:
      migration:
        condition: service_completed_successfully
      nginx:
        condition: service_healthy
    ports:
      - "${PORT:-5000}:5000"
    env_file: .env
    environment:
      COZE_PROJECT_ENV: PROD
      PORT: "5000"
      NODE_OPTIONS: "--max-old-space-size=2048"
      # 定时任务 cron 按此容器时区执行（croner 默认用进程时区）
      TZ: Asia/Shanghai
      # 自托管环境：应用经 Nginx 访问 PostgREST（覆盖 .env 中的云地址）
      COZE_SUPABASE_URL: http://nginx:80
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - loomflow-net

volumes:
  pgdata:
    name: loomflow-pgdata

networks:
  loomflow-net:
    name: loomflow-net
    driver: bridge
